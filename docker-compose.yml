services:
  redis:
    image: redis:7-alpine
    container_name: osc-brasil-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build: .
    container_name: osc-brasil-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_URL: postgresql+psycopg://postgres:postgres@host.docker.internal:5433/osc_brasil
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped
